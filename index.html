<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Playground</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="home-shell">
      <section class="hero" aria-label="Typing game selection">
        <p class="eyebrow">Elementary English Typing</p>
        <h1>Typing Playground</h1>
        <p class="intro">Choose a game and practice English words with quick hands.</p>

        <div class="game-grid">
          <a class="game-card fishing-card" href="./fishing/index.html">
            <span class="game-art" aria-hidden="true">
              <span class="pond">
                <span class="fish"></span>
                <span class="hook"></span>
              </span>
            </span>
            <span class="game-copy">
              <strong>Typing Fishing</strong>
              <span>Catch fish by typing the English word on each fish.</span>
            </span>
            <span class="play-label">Play Fishing</span>
          </a>

          <a class="game-card cafe-card" href="./cafe/index.html">
            <span class="game-art" aria-hidden="true">
              <span class="counter">
                <span class="plate">🍰</span>
                <span class="ticket"></span>
              </span>
            </span>
            <span class="game-copy">
              <strong>Typing Cafe</strong>
              <span>Serve cafe orders before the patience bar runs out.</span>
            </span>
            <span class="play-label">Play Cafe</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
