<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Fishing</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-label="Typing fishing game">
        <header class="top-bar">
          <div>
            <p class="eyebrow">Elementary English Typing</p>
            <h1>Typing Fishing</h1>
          </div>
          <div class="controls">
            <a class="home-link" href="../index.html">Home</a>
            <label class="select-wrap">
              <span>Start Level</span>
              <select id="levelSelect">
                <option value="1">Level 1</option>
                <option value="3" selected>Level 3</option>
                <option value="5">Level 5</option>
              </select>
            </label>
            <button id="startButton" type="button">Start</button>
          </div>
        </header>

        <div class="score-row" aria-label="Game score">
          <div>
            <span id="scoreValue">0</span>
            <small>score</small>
          </div>
          <div>
            <span id="comboValue">0</span>
            <small>combo</small>
          </div>
          <div>
            <span id="accuracyValue">100%</span>
            <small>accuracy</small>
          </div>
          <div>
            <span id="levelValue">1</span>
            <small>level</small>
          </div>
        </div>

        <div class="pond" id="pond" aria-live="polite">
          <div class="sun"></div>
          <div class="cloud cloud-one"></div>
          <div class="cloud cloud-two"></div>
          <div class="pier">
            <img class="rod" src="./assets/fishing-rod.svg" alt="" aria-hidden="true" />
          </div>
          <div class="water-line"></div>
          <div class="ripples"></div>
          <div class="message-card" id="messageCard">
            <strong>Ready?</strong>
            <span>Type the word on a fish to catch it.</span>
          </div>
        </div>

        <form class="typing-box" id="typingForm" autocomplete="off">
          <input
            id="wordInput"
            name="word"
            type="text"
            inputmode="latin"
            autocapitalize="off"
            spellcheck="false"
            placeholder="type a fish word here"
            aria-label="Type the fish word"
          />
          <button type="submit">Catch</button>
        </form>
      </section>

      <aside class="side-panel" aria-label="Fishing progress">
        <section class="captain">
          <div class="avatar" aria-hidden="true">
            <span></span>
          </div>
          <div>
            <h2>Today&apos;s Catch</h2>
            <p id="feedbackText">Choose a level and start fishing.</p>
          </div>
        </section>

        <section class="level-card">
          <div class="section-title">
            <h2>Level Goal</h2>
            <span id="goalLabel">0 / 0</span>
          </div>
          <div class="progress-track" aria-label="Level progress">
            <div id="goalBar" class="progress-fill"></div>
          </div>
        </section>

        <section class="miss-card">
          <div class="section-title">
            <h2>Chances</h2>
            <span id="missLabel">5 left</span>
          </div>
          <div class="chance-dots" id="chanceDots" aria-label="Remaining chances"></div>
        </section>

        <section class="aquarium">
          <div class="section-title">
            <h2>Aquarium</h2>
            <span id="caughtCount">0 fish</span>
          </div>
          <div class="tank" id="tank" aria-label="Caught fish collection"></div>
        </section>

        <section class="word-bank">
          <div class="section-title">
            <h2>Practice Words</h2>
            <span id="wordLevelLabel">Normal</span>
          </div>
          <div id="wordBank" class="word-list"></div>
        </section>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
